name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-checks:
    name: CPU checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check syntax
        run: |
          mkdir -p ci-logs
          python -m compileall -q src terminal-chat.py 2>&1 | tee ci-logs/compile.log
      - name: Check runtime correctness
        run: |
          python -m ruff check --select F,E9 \
            src/cortex/cortex \
            src/cortex/cluster/discovery/discovery_k8s.py \
            src/common/protocol/agent_types.py \
            src/common/primer.py \
            src/common/system/configuration.py \
            src/test/test_cortex_agent.py \
            src/test/test_inference_gateway.py \
            src/test/test_harness_agent_integration.py \
            src/test/test_agent_support.py \
            src/test/test_terminal_notices.py terminal-chat.py \
            src/test/test_kubernetes_discovery.py \
            2>&1 | tee ci-logs/lint.log
      - name: Run deterministic tests
        run: |
          python -m unittest discover -v -s src/test -p 'test_*.py' \
            2>&1 | tee ci-logs/tests.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpu-check-failure-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

name: Lab MCP

on:
  pull_request:
    paths: ['tools/lab-mcp/**', '.github/workflows/lab-mcp.yml']
  push:
    branches: [main, lab-mcp-access]
    paths: ['tools/lab-mcp/**', '.github/workflows/lab-mcp.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-mcp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol-checks:
    name: MCP Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/lab-mcp/requirements.txt
      - run: python -m pip install -r tools/lab-mcp/requirements.txt
      - run: python -m compileall -q tools/lab-mcp
      - run: python -m unittest discover -v -s tools/lab-mcp/tests
